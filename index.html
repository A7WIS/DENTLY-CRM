<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DENTLY CRM</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
:root{--navy:#081220;--teal:#00B8A9;--mint:#7EE6D1;--white:#F3F5F7;--muted:#A4B0BE}
*{box-sizing:border-box}
body{margin:0;background:#eef2f5;color:var(--navy);font:15px Tahoma,Arial,sans-serif}
header{background:var(--navy);color:#fff;padding:18px 22px;display:flex;align-items:center;justify-content:space-between}
header strong{font:700 27px Arial;letter-spacing:2px}
header small{display:block;color:var(--mint);font-size:10px;letter-spacing:2px}
.shell{max-width:1100px;margin:auto;padding:22px}
.card{background:#fff;border-radius:17px;padding:22px;margin-bottom:16px;box-shadow:0 5px 24px #0812200c}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit;border-radius:9px;padding:11px;border:1px solid #d5dfe5;min-width:0}
input,select{flex:1}
button{background:var(--teal);color:var(--navy);font-weight:bold;border:0;cursor:pointer}
button.secondary{background:#e5f7f3}
button:disabled{opacity:.5}
nav{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
nav button{background:#fff}
nav button.active{background:var(--navy);color:#fff}
h2{margin:0 0 14px}
table{width:100%;border-collapse:collapse;text-align:right}
th,td{padding:11px;border-bottom:1px solid #e7edf1}
th{color:#627482;font-size:12px}
#status{margin:10px 0;color:#345}
#error{color:#a52235;white-space:pre-wrap;min-height:22px}
#gbtn{display:flex;justify-content:center;min-height:44px;margin-top:18px}
.metric{background:#f3f8f9;padding:15px;border-radius:12px;min-width:150px;flex:1}
.metric b{display:block;font-size:23px;margin-top:8px}
label{display:block;font-size:13px;margin:9px 0 5px}
textarea{width:100%;min-height:85px}
.hidden{display:none!important}
.scroll{overflow-x:auto}
@media(max-width:600px){.shell{padding:12px}.card{padding:15px}header{padding:14px}header strong{font-size:22px}}
</style>
</head>
<body>
<header>
  <div><strong>DENTLY</strong><small>SMART DENTAL SUPPLY · CRM</small></div>
  <span id="identity"></span>
</header>

<main class="shell">
  <section id="login" class="card">
    <h2>تسجيل الدخول</h2>
    <p>الدخول مخصص للمسؤولين والمندوبات المعتمدين ضمن منظومة DENTLY.</p>
    <div id="gbtn"></div>
    <p id="error"></p>
  </section>

  <section id="app" class="hidden">
    <nav>
      <button onclick="tab('mine')" id="tab-mine">حسابي</button>
      <button onclick="tab('overview')" id="tab-overview">الأداء</button>
      <button onclick="tab('customers')" id="tab-customers">العملاء</button>
      <button onclick="tab('activities')" id="tab-activities">الأنشطة</button>
      <button onclick="tab('newCustomer')" id="tab-newCustomer">عميل جديد</button>
      <button onclick="logout()" class="secondary">خروج</button>
    </nav>
    <p id="status"></p>

    <section id="mine" class="card view hidden">
      <h2>حسابي هذا الشهر</h2>
      <div class="row"><input type="month" id="myMonth"><button onclick="loadMine()">عرض</button></div>
      <div id="mineBody"></div>
    </section>

    <section id="overview" class="card view hidden">
      <h2>مؤشرات الأداء</h2>
      <div class="row">
        <input type="month" id="month">
        <select id="rep" class="hidden"></select>
        <button onclick="loadPerformance()">عرض التقرير</button>
        <button id="teamBtn" class="hidden secondary" onclick="team()">الفريق</button>
      </div>
      <div id="metrics" class="row" style="margin-top:16px"></div>
    </section>

    <section id="customers" class="card view hidden">
      <h2>العملاء</h2>
      <div class="row">
        <input id="search" placeholder="بحث بالاسم أو الهاتف أو المعرف">
        <button onclick="customers()">بحث</button>
      </div>
      <div class="scroll" id="customerTable"></div>
    </section>
    <div id="detail"></div>

    <section id="activities" class="card view hidden">
      <h2>سجل الأنشطة</h2>
      <button onclick="activities()">تحديث</button>
      <div class="scroll" id="activityTable"></div>
    </section>

    <section id="newCustomer" class="card view hidden">
      <h2>تسجيل عميل جديد</h2>
      <label>النوع</label>
      <select id="ncType" onchange="ncType()"><option>طبيب</option><option>طالب</option></select>
      <label>الاسم الثلاثي</label><input id="ncName">
      <label>رقم الهاتف (09xxxxxxxx)</label><input id="ncPhone" inputmode="numeric" maxlength="10">
      <div id="ncDoc"><label>منطقة العيادة</label><input id="ncArea"></div>
      <div id="ncStu" class="hidden"><label>الجامعة</label><input id="ncUni"><label>السنة الدراسية</label><input id="ncYear"></div>
      <label>ملاحظات</label><textarea id="ncNotes"></textarea>
      <button onclick="addCustomer()">تسجيل العميل</button>
    </section>
  </section>
</main>

<script src="config.js"></script>
<script>

let session = sessionStorage.getItem('dently_session') || '', user = null;
const $ = id => document.getElementById(id);
const safe = x => String(x ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- الاتصال بالخادم (بديل google.script.run) ---------- */
async function rpc(fn, args) {
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ fn, args }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'خطأ غير معروف');
  return j.data;
}

function call(name, args, ok) {
  $('status').textContent = 'جارٍ التحميل...';
  rpc(name, args).then(x => { $('status').textContent = ''; ok(x); })
    .catch(e => {
      $('status').textContent = '';
      if (/الجلسة/.test(e.message)) return logout(e.message);
      alert(e.message);
    });
}

/* ---------- الدخول والخروج ---------- */
async function onCredential(resp) {
  $('error').textContent = 'جارٍ التحقق…';
  try {
    const u = await rpc('login', [resp.credential]);
    session = u.session;
    sessionStorage.setItem('dently_session', session);
    $('error').textContent = '';
    start();
  } catch (e) {
    $('error').textContent = e.message || 'تعذر تسجيل الدخول.';
  }
}

function start() {
  rpc('dw08Bootstrap', [session]).then(r => {
    user = r.user;
    $('login').classList.add('hidden');
    $('app').classList.remove('hidden');
    $('identity').textContent = user.role === 'ADMIN' ? 'الإدارة' : 'المندوبة ' + user.srId;
    $('month').value = new Date().toISOString().slice(0, 7);
    const isAdmin = user.role === 'ADMIN';
    $('rep').classList.toggle('hidden', !isAdmin);
    $('teamBtn').classList.toggle('hidden', !isAdmin);
    $('tab-newCustomer').classList.toggle('hidden', isAdmin);
    if (isAdmin) {
      $('rep').innerHTML = r.reps.map(x => '<option value="' + safe(x.id) + '">' + safe(x.name) + ' · ' + safe(x.id) + '</option>').join('');
    }
    $('tab-overview').classList.toggle('hidden', !isAdmin);
    $('tab-mine').classList.toggle('hidden', isAdmin);
    $('myMonth').value = today().slice(0, 7);
    if (isAdmin) { tab('overview'); loadPerformance(); } else { tab('mine'); loadMine(); }
  }).catch(e => logout(e.message));
}

function logout(msg) {
  if (session) rpc('logout', [session]).catch(() => {});
  session = ''; user = null;
  sessionStorage.removeItem('dently_session');
  $('app').classList.add('hidden');
  $('login').classList.remove('hidden');
  $('identity').textContent = '';
  $('error').textContent = typeof msg === 'string' ? msg : '';
}

/* ---------- الواجهة (كما هي من WebApp_08) ---------- */
function tab(id) {
  document.querySelectorAll('.view').forEach(x => x.classList.add('hidden'));
  $(id).classList.remove('hidden');
  document.querySelectorAll('nav button').forEach(x => x.classList.remove('active'));
  $('tab-' + id).classList.add('active');
  if (id !== 'customers') $('detail').innerHTML = '';
  if (id === 'customers') customers();
  if (id === 'activities') activities();
}
function metric(name, value) { return '<div class="metric">' + safe(name) + '<b>' + safe(value) + '</b></div>'; }
function loadPerformance() {
  call('dw08Performance', [session, $('month').value, user.role === 'ADMIN' ? $('rep').value : ''], r => {
    $('metrics').innerHTML = metric('العملاء الجدد', r.newCustomers) + metric('الأنشطة المعتمدة', r.approvedActivities) +
      metric('رصيد النقاط', r.currentPointsBalance) + metric('المبيعات المحصلة', r.revenue) +
      metric('الربح الإجمالي', r.grossProfit) + metric('العمولات المعتمدة', r.approvedCommissions);
  });
}
function team() {
  call('dw08TeamPerformance', [session, $('month').value], r => {
    $('metrics').innerHTML = (r.reps || []).map(x => '<div class="metric"><b>' + safe(x.name) + '</b>مبيعات: ' + safe(x.revenue) + '<p>عمولات: ' + safe(x.approvedCommissions) + '</p></div>').join('');
  });
}
function table(headers, rows) {
  return '<table><thead><tr>' + headers.map(x => '<th>' + safe(x[0]) + '</th>').join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + headers.map(x => '<td>' + safe(r[x[1]]) + '</td>').join('') + '</tr>').join('') + '</tbody></table>';
}
let cur = '', curData = null, rows = [];
const today = () => new Date(Date.now() - new Date().getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
const TL = { CONTACT: 'تواصل فعلي', POTENTIAL_LEAD: 'عميل محتمل', REGISTRATION: 'تسجيل التطبيق', SUPPLY_FIRST_ORDER: 'أول طلب Supply', SUPPLY_SECOND_ORDER: 'ثاني طلب Supply', SUPPLY_THIRD_ORDER: 'ثالث طلب Supply', LAB_LEAD: 'فرصة LAB', LAB_FIRST_CASE: 'أول حالة LAB', LAB_SECOND_CASE: 'ثاني حالة LAB', LAB_THIRD_CASE: 'ثالث حالة LAB', RECURRING_LAB_DOCTOR: 'طبيب LAB متكرر', IMDAD_SUBSCRIBER: 'اشتراك IMDAD', FIELD_VISIT: 'زيارة ميدانية' };
const ST = { Pending: 'قيد المراجعة', Approved: 'معتمد', Rejected: 'مرفوض' };

function bar(v, t) {
  const p = t ? Math.min(100, Math.round(v / t * 100)) : 0;
  return '<div style="background:#e7edf1;border-radius:8px;height:9px;margin:8px 0 0"><div style="width:' + p + '%;background:var(--teal);height:9px;border-radius:8px"></div></div>';
}
function loadMine() {
  call('flowMyMonth', [session, $('myMonth').value], d => {
    const c = d.commissions;
    let h = '<div class="row" style="margin-top:14px">' + metric('رصيد النقاط الكلي', d.points.balance) + metric('نقاط هذا الشهر', d.points.month) +
      metric('عمولات معتمدة', c.approved) + metric('عمولات قيد الاعتماد', c.pending) + '</div>' +
      '<p>العمولات المعتمدة حسب المسار — Supply: ' + safe(c.byPath.Supply) + ' · LAB: ' + safe(c.byPath.LAB) + ' · IMDAD: ' + safe(c.byPath.IMDAD) + '</p>' +
      '<h3>أهداف الشهر</h3><div class="row">' + d.goals.map(g => '<div class="metric">' + safe(g.label) + '<b>' + (g.value == null ? '—' : safe(g.value)) + ' / ' + safe(g.target) + '</b>' + (g.value == null ? '' : bar(g.value, g.target)) + '</div>').join('') + '</div>' +
      '<h3>مواعيد المتابعة</h3>';
    h += d.followUps.length
      ? '<div class="scroll">' + table([['الموعد', 'date'], ['العميل', 'name'], ['النشاط', 'type'], ['', 'state']], d.followUps.map(f => ({ date: f.date, name: f.name, type: TL[f.type] || f.type, state: f.overdue ? 'متأخر' : '' }))) + '</div>'
      : '<p>لا توجد مواعيد متابعة لهذا الشهر.</p>';
    h += '<p>أنشطة بانتظار الاعتماد: ' + safe(d.pendingActivities) + ' · أنشطة معتمدة هذا الشهر: ' + safe(d.activities.approved) + '</p>';
    $('mineBody').innerHTML = h;
  });
}

function customers() {
  call('dw08Customers', [session, $('search').value], r => {
    rows = r;
    $('customerTable').innerHTML = '<table><thead><tr><th>الاسم</th><th>النوع</th><th>الهاتف</th><th>المنطقة</th><th></th></tr></thead><tbody>' +
      r.map((x, i) => '<tr><td>' + safe(x.name) + '</td><td>' + safe(x.type) + '</td><td>' + safe(x.phone) + '</td><td>' + safe(x.area) + '</td><td><button onclick="openCustomer(' + i + ')">فتح</button></td></tr>').join('') + '</tbody></table>';
  });
}

function openCustomer(i) {
  const id = typeof i === 'number' ? rows[i].id : i;
  call('flowGetCustomer', [session, id], renderCustomer);
}

function renderCustomer(d) {
  cur = d.customer.id; curData = d;
  const c = d.customer, P = { SUPPLY: 'Supply', LAB: 'LAB', IMDAD: 'IMDAD' };
  let h = '<div class="card"><h2>' + safe(c.name) + '</h2><p>' + safe(c.type) + ' · ' + safe(c.phone) + ' · ' + safe(c.area || c.university) + '</p><h3>حالة العميل</h3>';
  Object.keys(P).forEach(p => {
    h += '<label>' + P[p] + '</label><div class="row"><select id="st-' + p + '">' +
      d.options[p].map(o => '<option' + (o === d.statuses[p] ? ' selected' : '') + '>' + safe(o) + '</option>').join('') +
      '</select><button onclick="saveStatus(\'' + p + '\')">حفظ</button></div>';
  });
  h += '<p>تغيير الحالة لا يمنح نقاطاً. النقاط تُمنح فقط عند تسجيل النشاط واعتماده من الإدارة.</p>';
  if (d.canLog) {
    const open = d.activities.filter(a => a.unlocked && !a.logged), shut = d.activities.filter(a => !(a.unlocked && !a.logged));
    h += '<h3>تسجيل نشاط</h3>';
    if (!open.length) h += '<p>لا توجد أنشطة متاحة حالياً.</p>';
    else h += '<label>النشاط</label><select id="actType">' + open.map(a => '<option value="' + safe(a.code) + '">' + safe(a.label) + ' (+' + a.points + ')</option>').join('') + '</select>' +
      '<label>تاريخ النشاط</label><input type="date" id="actDate" value="' + today() + '" max="' + today() + '">' +
      '<label>قناة التواصل (للتواصل والزيارة والفرص)</label><select id="actChannel"><option>WhatsApp</option><option>اتصال هاتفي</option><option>زيارة ميدانية</option><option>أخرى</option></select>' +
      '<label>رقم الطلب أو مرجع الإثبات (إلزامي للطلبات والحالات والاشتراك)</label><input id="actRef">' +
      '<label>ملاحظات (إلزامية للزيارة والعميل المحتمل وفرصة LAB)</label><textarea id="actNotes"></textarea>' +
      '<label>موعد المتابعة (اختياري، يظهر في مهامك)</label><input type="date" id="actNext" min="' + today() + '">' +
      '<button onclick="logActivity()">إرسال للمراجعة</button>';
    if (shut.length) h += '<p>غير متاح الآن: ' + shut.map(a => safe(a.label) + (a.logged ? ' (مسجّل)' : ' (يتطلب حالة أعلى)')).join('، ') + '</p>';
  }
  $('detail').innerHTML = h + '</div>';
  $('detail').scrollIntoView({ behavior: 'smooth' });
}

function saveStatus(p) {
  call('flowSetStatus', [session, cur, p, $('st-' + p).value], r => { alert(r.changed ? 'تم حفظ الحالة' : 'لا يوجد تغيير'); openCustomer(cur); });
}

function logActivity() {
  const code = $('actType').value, a = curData.activities.find(x => x.code === code);
  const p = { customerId: cur, activityType: code, channel: a.contact ? $('actChannel').value : '', activityDate: $('actDate').value, evidence: $('actRef').value, notes: $('actNotes').value, nextFollowUp: $('actNext').value };
  call('flowCreateActivity', [session, p], r => { alert(r.message || 'تم تسجيل النشاط'); openCustomer(cur); });
}

function ncType() {
  const doc = $('ncType').value === 'طبيب';
  $('ncDoc').classList.toggle('hidden', !doc); $('ncStu').classList.toggle('hidden', doc);
}

function addCustomer() {
  const p = { type: $('ncType').value, name: $('ncName').value, phone: $('ncPhone').value, clinicArea: $('ncArea').value, university: $('ncUni').value, studyYear: $('ncYear').value, notes: $('ncNotes').value };
  call('addDentlyCustomer', [session, p], r => {
    if (!r.success) return alert(r.message || 'تعذر التسجيل');
    alert('تم تسجيل العميل');
    ['ncName', 'ncPhone', 'ncArea', 'ncUni', 'ncYear', 'ncNotes'].forEach(k => $(k).value = '');
    tab('customers'); openCustomer(r.customerId);
  });
}

function activities() {
  call('dw08Activities', [session], r => {
    $('activityTable').innerHTML = '<table><thead><tr><th>التاريخ</th><th>النشاط</th><th>العميل</th><th>الحالة</th><th>النقاط</th></tr></thead><tbody>' +
      r.slice().reverse().map(x => '<tr><td>' + safe(x.activityDate) + '</td><td>' + safe(TL[x.activityType] || x.activityType) + '</td><td>' + safe(x.customerId) + '</td><td>' + safe(ST[x.status] || x.status) + (x.rejectionReason ? ' — ' + safe(x.rejectionReason) : '') + '</td><td>' + safe(x.proposedPoints) + '</td></tr>').join('') + '</tbody></table>';
  });
}

/* ---------- التهيئة ---------- */
window.addEventListener('load', () => {
  if (session) start();
  const wait = setInterval(() => {
    if (!window.google || !google.accounts) return;
    clearInterval(wait);
    google.accounts.id.initialize({ client_id: CLIENT_ID, callback: onCredential });
    google.accounts.id.renderButton($('gbtn'), { theme: 'outline', size: 'large', text: 'continue_with', locale: 'ar', width: 280 });
  }, 100);
});
</script>
</body>
</html>
